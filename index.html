const QUIZ=[{"q":"A cube viewed from a corner can show at most how many faces at once?","options":["2","3","4","5"],"answer":1,"explain":"Three mutually adjacent faces can be seen from a corner view.","topic":"Spatial"},{"q":"Which net can fold into a cube?","options":["Six squares joined in a straight row","Six squares arranged as a valid cross","Six separate unconnected squares","Five squares only"],"answer":1,"explain":"A valid cross-shaped arrangement of six squares can fold into a cube.","topic":"Spatial"},{"q":"A water bottle is 24 cm high and 8 cm wide. A half-scale sketch should be how wide?","options":["2 cm","4 cm","8 cm","12 cm"],"answer":1,"explain":"Scaling by one half changes width from 8 cm to 4 cm.","topic":"Proportion"},{"q":"Which feature most reduces the chance of a tall glass tipping?","options":["Narrower base","Wider stable base","Higher centre of mass","Smooth rounded bottom"],"answer":1,"explain":"A wider base generally increases resistance to tipping.","topic":"Design"},{"q":"What is negative space in observational drawing?","options":["Only shaded areas","Empty shapes around and between objects","Any white paint","Hidden back surface"],"answer":1,"explain":"Negative space describes the surrounding and interior gaps.","topic":"Drawing"},{"q":"A cube rotates about its vertical axis. Which face stays on top?","options":["Front","Right","Bottom","Top"],"answer":3,"explain":"Turning about the vertical axis keeps the top face on top.","topic":"Spatial"},{"q":"What does a vanishing point help represent?","options":["Shading texture","Receding parallel directions","Object weight","Surface colour"],"answer":1,"explain":"Parallel lines in certain directions appear to converge in perspective drawings.","topic":"Drawing"},{"q":"When making a product for young children, which should come first?","options":["More complicated buttons","Safety and ease of use","Bright advertising","Maximum number of features"],"answer":1,"explain":"Safety and usability should guide the first design choices.","topic":"Design"},{"q":"Which shape is most similar to the body of a soda can?","options":["Sphere","Cone","Cylinder","Cube"],"answer":2,"explain":"A soda can approximates a cylinder.","topic":"Spatial"},{"q":"If a rectangle is 3 units wide and 6 units tall, what width matches a drawing 10 units tall?","options":["4","5","6","8"],"answer":1,"explain":"The ratio width:height is 1:2, so 10 tall corresponds to 5 wide.","topic":"Proportion"},{"q":"Which is the strongest way to explain a new locking mechanism?","options":["Decorative borders only","A labeled open and closed view","A long unrelated paragraph","Only the product name"],"answer":1,"explain":"Show different states of a mechanism and clear callouts.","topic":"Design"},{"q":"What can you check to judge the proportions of a cup?","options":["Compare its height to its width","Only its colour","Paper thickness","Pencil brand"],"answer":0,"explain":"Height-to-width comparisons reveal the basic proportion.","topic":"Drawing"},{"q":"A paper is folded once vertically and a hole is punched through both layers. On unfolding, usually how many holes appear?","options":["1","2","3","4"],"answer":1,"explain":"Two layers produce a mirrored pair if the punch goes through both layers away from the fold.","topic":"Spatial"},{"q":"What helps an object stay in place on a smooth table?","options":["Lower friction","Anti-slip rubber feet","Rounded bottom","Extra tall legs"],"answer":1,"explain":"Rubber feet improve grip and reduce sliding.","topic":"Design"},{"q":"For an accessible one-hand lunchbox, what is especially important?","options":["Two simultaneous latches","One-hand operable secure closure","No hinge","Heaviest possible lid"],"answer":1,"explain":"The latch and opening must be operable with one hand while staying secure.","topic":"Design"},{"q":"Which view is generally most useful for showing a product opening?","options":["Only closed exterior","A labeled open view","Only its logo","A solid silhouette"],"answer":1,"explain":"An open view reveals how parts move and interact.","topic":"Drawing"},{"q":"What is an ellipse in a sketch of a cylindrical cup?","options":["Its side wall","The rim seen at an angle","The shadow only","A straight edge"],"answer":1,"explain":"A circular rim typically looks elliptical in perspective.","topic":"Drawing"},{"q":"When designing a public bin, which pair of needs is important?","options":["Looks only and colour","User access and cleaning access","Decoration and branding","Size only"],"answer":1,"explain":"Design for both the people using it and staff maintaining it.","topic":"Design"},{"q":"How many edges does a cube have?","options":["6","8","12","16"],"answer":2,"explain":"A cube has 12 edges.","topic":"Spatial"},{"q":"Which is a useful first step in any design challenge?","options":["Choose the prettiest colour","Understand user and problem","Start shading immediately","Add electronics"],"answer":1,"explain":"Define who uses the product, and the problem to solve.","topic":"Design"},{"q":"A top view is looking at an object from which direction?","options":["Below","Above","Front","Right"],"answer":1,"explain":"The top view shows its appearance from above.","topic":"Spatial"},{"q":"Why are multiple concepts useful before choosing a design?","options":["They remove all testing","They allow comparing trade-offs","They guarantee a perfect answer","They replace drawings"],"answer":1,"explain":"Alternative ideas reveal different advantages and drawbacks.","topic":"Design"},{"q":"A simple box viewed straight from the front may look like which 2D shape?","options":["Triangle","Rectangle","Circle","Ellipse"],"answer":1,"explain":"The face of a rectangular box is a rectangle.","topic":"Spatial"},{"q":"For a child-safe design, exposed sharp corners should usually be:","options":["Made sharper","Rounded or protected","Left unchanged","Painted only"],"answer":1,"explain":"Rounded or protected edges reduce injury risk.","topic":"Design"},{"q":"Which is the most informative label on a sketch?","options":["Nice product","Spring-loaded latch releases when button is pressed","Cool idea","My drawing"],"answer":1,"explain":"Specific functional labels explain what a part does.","topic":"Design"}];

quizIndex,correct:state.quizAnswer===q.answer,at:new Date().toISOString()});save(keys.quiz,state.quiz);quiz()};$('nextQuiz').onclick=()=>{let old=state.quizIndex;pickQuiz();if(state.quizIndex===old)state.quizIndex=(old+1)%QUIZ.length;quiz()}}
function journal(){let notes=Object.entries(state.notes).filter(([k,v])=>v.trim());draw('Your design journal','REFLECT AND IMPROVE',`<div class="card"><h3>Saved design notes</h3><p class="muted small">You have ${notes.length} saved notes. They stay on this device/browser unless you export them.</p>${notes.length?notes.sort((a,b)=>Number(a[0])-Number(b[0])).map(([k,v])=>`<div class="listitem"><div class="spread"><strong>Day ${E(k)} — ${E(BANK[Number(k)-1]?.title||'Challenge')}</strong><button class="btn ghost" data-open-note="${E(k)}">Open →</button></div><p class="small" style="white-space:pre-wrap;margin:10px 0 0">${E(v.slice(0,480))}${v.length>480?'…':''}</p></div>`).join(''):'<p class="muted">No notes yet. Open a challenge and write your first idea.</p>'}</div><div class="card"><h3>Your artwork</h3><p class="small muted">For sketch feedback, you can take a photo and share it directly in your ChatGPT conversation. This standalone app stores written notes and completion progress, but does not upload or store photos.</p><label class="btn secondary" for="photoInput" style="display:inline-block;cursor:pointer">Preview a sketch photo</label><input id="photoInput" type="file" accept="image/*" class="hidden"><div id="photoPreview"></div></div><div class="card"><h3>Backup your progress</h3><p class="small muted">Export a JSON file containing completed tasks, notes, plan and aptitude history. Import it later into this app on the same or another device. Sketch photos are not included.</p><div class="row"><button class="btn" id="exportData">Download backup</button><label class="btn secondary" for="importData" style="cursor:pointer">Import backup</label><input id="importData" type="file" accept="application/json,.json" class="hidden"><button class="btn ghost" id="resetData">Reset data</button></div></div>`);document.querySelectorAll('[data-open-note]').forEach(b=>b.onclick=()=>{state.day=Number(b.dataset.openNote);navigate('challenges')});$('photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);$('photoPreview').innerHTML='<p class="note">Preview only — not saved</p>';let img=el('img','photo');img.src=u;img.onload=()=>URL.revokeObjectURL(u);$('photoPreview').appendChild(img)};$('exportData').onclick=exportData;$('importData').onchange=importData;$('resetData').onclick=()=>{if(confirm('Erase all progress, notes and quiz history on this browser? Export a backup first.')){Object.values(keys).forEach(k=>localStorage.removeItem(k));location.reload()}}}
function exportData(){const data={app:'DesignSprint',version:1,exported:new Date().toISOString(),progress:state.progress,notes:state.notes,plan:state.plan,quiz:state.quiz,settings:state.settings};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=el('a');a.href=url;a.download='DesignSprint-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function importData(e){const file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='DesignSprint'||obj.version!==1||typeof obj.progress!=='object'||typeof obj.notes!=='object'||!Array.isArray(obj.quiz))throw Error('Invalid backup format');if(!confirm('Replace current progress and notes with this backup?'))return;state.progress=obj.progress;state.notes=obj.notes;state.plan=obj.plan||{};state.quiz=obj.quiz;state.settings=obj.settings||{dailyMins:30};save(keys.progress,state.progress);save(keys.notes,state.notes);save(keys.plan,state.plan);save(keys.quiz,state.quiz);save(keys.setting,state.settings);journal();notify('Backup imported successfully')}catch(err){notify('Could not import this backup: '+err.message)}}
function resourcesPage(){draw('Learning resources','OFFICIAL PAPERS + FREE LESSONS',`<div class="card"><h3>Recommended resources</h3><p class="muted small">Open each resource in a new tab. You can use the app offline after downloading it, but external websites and videos require internet.</p>${resources.map(r=>`<div class="listitem"><strong>${E(r[0])}</strong><p class="small muted" style="margin:6px 0">${E(r[2])}</p><a href="${E(r[1])}" target="_blank" rel="noopener noreferrer">Open resource ↗</a></div>`).join('')}</div><div class="card"><h3>Before Class 10 boards</h3><p class="small muted">Aim for roughly 25–30 minutes per day, with optional weekend challenges. Exam dates and formats may change by your 2029 attempt: verify the official sites before registering.</p><p class="note">All 550 prompts and 25 aptitude questions are custom-created practice content; they are not official previous-year exam questions.</p></div>`)}
function render(){switch(state.page){case'home':home();break;case'challenges':challenges();break;case'planner':planner();break;case'quiz':quiz();break;case'journal':journal();break;case'resources':resourcesPage();break}}
render();
</script></body></html>
