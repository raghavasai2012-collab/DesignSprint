atures.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":7,"level":1,"theme":"School & learning","title":"Crowded noticeboard","prompt":"Important school notices get lost among old posters. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":8,"level":1,"theme":"Home & everyday objects","title":"Slippery soap","prompt":"A wet bar of soap repeatedly slips from someone’s hand. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":9,"level":1,"theme":"Home & everyday objects","title":"Key confusion","prompt":"A family mixes up similar-looking house keys. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":10,"level":1,"theme":"Home & everyday objects","title":"Unstable mug","prompt":"A mug tips over when placed on a narrow side table. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":11,"level":1,"theme":"Home & everyday objects","title":"Cluttered charging","prompt":"Charging cables tangle on a crowded bedside table. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":12,"level":1,"theme":"Home & everyday objects","title":"Dark staircase","prompt":"Someone struggles to ation + clear idea"},{"id":18,"level":1,"theme":"Public transport & travel","title":"Bus boarding","prompt":"Passengers with bags struggle to board a crowded city bus. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":19,"level":1,"theme":"Public transport & travel","title":"Ticket queue","prompt":"People cannot tell where the queue starts at a busy ticket counter. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":20,"level":1,"theme":"Public transport & travel","title":"Luggage mix-up","prompt":"Travellers cannot identify similar suitcases on a luggage belt. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":21,"level":1,"theme":"Public transport & travel","title":"Metro handhold","prompt":"Short passengers cannot comfortably reach overhead handholds. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":22,"level":1,"theme":"Public transport & travel","title":"Platform wayfinding","prompt":"First-time travellers struggle to locate their train platform. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":15,"focus":"Observation + clear idea"},{"id":23,"level":1,"theme":"Public transport & travel","title":"Cyclist parking","prompt":"Bicycles lean against each other in a small parking sentence explanation","minutes":17,"focus":"Observation + clear idea"},{"id":29,"level":1,"theme":"Accessibility & inclusion","title":"Hearing alert","prompt":"A person who is hard of hearing misses the doorbell. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":17,"focus":"Observation + clear idea"},{"id":30,"level":1,"theme":"Accessibility & inclusion","title":"Short reach","prompt":"A young child cannot safely reach a bathroom sink. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":17,"focus":"Observation + clear idea"},{"id":31,"level":1,"theme":"Accessibility & inclusion","title":"Crutch storage","prompt":"A person using crutches needs a place to rest them when seated. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":17,"focus":"Observation + clear idea"},{"id":32,"level":1,"theme":"Accessibility & inclusion","title":"Colour-blind map","prompt":"A map relies only on red and green to distinguish routes. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":17,"focus":"Observation + clear idea"},{"id":33,"level":1,"theme":"Accessibility & inclusion","title":"Tremor spoon","prompt":"A person with shaky hands finds it difficult to eat soup. Sketch one practical improvement. Show a before-and-after view and label two useful features.","deliverables":"1 concept; 2 views; 2 labels; 1-sentence explanation","minutes":17,"focus":"Observation + clear idea"},{"id":34,"level":1,"theme":"Accessibility & inclusion","title":"Public bench","prompt":"An older adult finds a park bench difficu const QUIZ=[{"q":"A cube viewed from a corner can show at most how many faces at once?","options":["2","3","4","5"],"answer":1,"explain":"Three mutually adjacent faces can be seen from a corner view.","topic":"Spatial"},{"q":"Which net can fold into a cube?","options":["Six squares joined in a straight row","Six squares arranged as a valid cross","Six separate unconnected squares","Five squares only"],"answer":1,"explain":"A valid cross-shaped arrangement of six squares can fold into a cube.","topic":"Spatial"},{"q":"A water bottle is 24 cm high and 8 cm wide. A half-scale sketch should be how wide?","options":["2 cm","4 cm","8 cm","12 cm"],"answer":1,"explain":"Scaling by one half changes width from 8 cm to 4 cm.","topic":"Proportion"},{"q":"Which feature most reduces the chance of a tall glass tipping?","options":["Narrower base","Wider stable base","Higher centre of mass","Smooth rounded bottom"],"answer":1,"explain":"A wider base generally increases resistance to tipping.","topic":"Design"},{"q":"What is negative space in observational drawing?","options":["Only shaded areas","Empty shapes around and between objects","Any white paint","Hidden back surface"],"answer":1,"explain":"Negative space describes the surrounding and interior gaps.","topic":"Drawing"},{"q":"A cube rotates about its vertical axis. Which face stays on top?","options":["Front","Right","Bottom","Top"],"answer":3,"explain":"Turning about the vertical axis keeps the top face on top.","topic":"Spatial"},{"q":"What does a vanishing point help represent?","options":["Shading texture","Receding parallel directions","Object weight","Surface colour"],"answer":1,"explain":"Parallel lines in certain directions appear to converge in perspective drawings.","topic":"Drawing"},{"q":"When making a product for young children, which should come first?","options":["More complicated buttons","Safety and ease of use","Bright advertising","Maximum number of features"],"answer":1,"explain":"Safety and usability should guide the first design choices.","topic":"Design"},{"q":"Which shape is most similar to the body of a soda can?","options":["Sphere","Cone","Cylinder","Cube"],"answer":2,"explain":"A soda can approximates a cylinder.","topic":"Spatial"},{"q":"If a rectangle is 3 units wide and 6 units tall, what width matches a drawing 10 units tall?","options":["4","5","6","8"],"answer":1,"explain":"The ratio width:height is 1:2, so 10 tall corresponds to 5 wide.","topic":"Proportion"},{"q":"Which is the strongest way to explain a new locking mechanism?","options":["Decorative borders only","A labeled open and closed view","A long unrelated paragraph","Only the product name"],"answer":1,"explain":"Show different states of a mechanism and clear callouts.","topic":"Design"},{"q":"What can you check to judge the proportions of a cup?","options":["Compare its height to its width","Only its colour","Paper thickness","Pencil brand"],"answer":0,"explain":"Height-to-width comparisons reveal the basic proportion.","topic":"Drawing"},{"q":"A paper is folded once vertically and a hole is punched through both layers. On unfolding, usually how many holes appear?","options":["1","2","3","4"],"answer":1,"explain":"Two layers produce a mirrored pair if the punch goes through both layers away from the fold.","topic":"Spatial"},{"q":"What helps an object stay in place on a smooth table?","options":["Lower friction","Anti-slip rubber feet","Rounded bottom","Extra tall legs"],"answer":1,"explain":"Rubber feet improve grip and reduce sliding.","topic":"Design"},{"q":"For an accessible one-hand lunchbox, what is especially important?","options":["Two simultaneous latches","One-hand operable secure closure","No hinge","Heaviest possible lid"],"answer":1,"explain":"The latch and opening must be operable with one hand while staying secure.","topic":"Design"},{"q":"Which view is generally most useful for showing a product opening?","options":["Only closed exterior","A labeled open view","Only its logo","A solid silhouette"],"answer":1,"explain":"An open view reveals how parts move and interact.","topic":"Drawing"},{"q":"What is an ellipse in a sketch of a cylindrical cup?","options":["Its side wall","The rim seen at an angle","The shadow only","A straight edge"],"answer":1,"explain":"A circular rim typically looks elliptical in perspective.","topic":"Drawing"},{"q":"When designing a public bin, which pair of needs is important?","options":["Looks only and colour","User access and cleaning access","Decoration and branding","Size only"],"answer":1,"explain":"Design for both the people using it and staff maintaining it.","topic":"Design"},{"q":"How many edges does a cube have?","options":["6","8","12","16"],"answer":2,"explain":"A cube has 12 edges.","topic":"Spatial"},{"q":"Which is a useful first step in any design challenge?","options":["Choose the prettiest colour","Understand user and problem","Start shading immediately","Add electronics"],"answer":1,"explain":"Define who uses the product, and the problem to solve.","topic":"Design"},{"q":"A top view is looking at an object from which direction?","options":["Below","Above","Front","Right"],"answer":1,"explain":"The top view shows its appearance from above.","topic":"Spatial"},{"q":"Why are multiple concepts useful before choosing a design?","options":["They remove all testing","They allow comparing trade-offs","They guarantee a perfect answer","They replace drawings"],"answer":1,"explain":"Alternative ideas reveal different advantages and drawbacks.","topic":"Design"},{"q":"A simple box viewed straight from the front may look like which 2D shape?","options":["Triangle","Rectangle","Circle","Ellipse"],"answer":1,"explain":"The face of a rectangular box is a rectangle.","topic":"Spatial"},{"q":"For a child-safe design, exposed sharp corners should usually be:","options":["Made sharper","Rounded or protected","Left unchanged","Painted only"],"answer":1,"explain":"Rounded or protected edges reduce injury risk.","topic":"Design"},{"q":"Which is the most informative label on a sketch?","options":["Nice product","Spring-loaded latch releases when button is pressed","Cool idea","My drawing"],"answer":1,"explain":"Specific functional labels explain what a part does.","topic":"Design"}];

function home(){let n=accomplished(),next=BANK.find(x=>!state.progress[x.id]?.done)||BANK[BANK.length-1],recentDone=recent().slice(0,4);draw('Your design journey','WELCOME BACK',`<div class="hero"><div><div class="eyebrow">TODAY’S CREATIVE BRIEF</div><h2>${E(next.title)}</h2><p>${E(next.prompt)}</p><button class="btn" id="startPrompt">Start Day ${next.id} →</button></div><div style="font-size:75px;opacity:.65;flex-shrink:0">✏</div></div><div class="grid"><div class="card"><div class="muted small">Creative briefs completed</div><div class="stat">${n}<span class="muted" style="font-size:16px"> / 550</span></div><div class="progress"><div style="width:${n/550*100}%"></div></div></div><div class="card"><div class="muted small">Study-plan days done</div><div class="stat">${Object.values(state.plan).filter(Boolean).length}<span class="muted" style="font-size:16px"> / 30</span></div><div class="progress"><div style="width:${Object.values(state.plan).filter(Boolean).length/30*100}%"></div></div></div><div class="card"><div class="muted small">Aptitude questions answered</div><div class="stat">${state.quiz.length}</div><div class="small muted">${state.quiz.length?Math.round(state.quiz.filter(x=>x.correct).length/state.quiz.length*100)+'% correct':'Start a quiz to track accuracy'}</div></div></div><div class="columns"><div class="card"><h3>Your beginner learning path</h3><p class="muted">Follow the 30-day foundations plan alongside one creative challenge a day.</p><div id="homeplan"></div><button class="btn secondary" id="openPlan">View study plan →</button></div><div class="card"><h3>Recently completed</h3>${recentDone.length?recentDone.map(x=>`<div class="listitem small"><b>Day ${x.day}</b> · ${E(BANK[x.day-1]?.title)}<div class="note">${E(x.at?.slice(0,10)||'')}</div></div>`).join(''):'<p class="muted small">Your completed designs will appear here. Start with Day 1!</p>'}<button class="btn secondary" id="openJournal">Open journal →</button></div></div>`);$('startPrompt').onclick=()=>{state.day=next.id;navigate('challenges')};$('openPlan').onclick=()=>navigate('planner');$('openJournal').onclick=()=>navigate('journal');let nextDays=PLAN.map((p,i)=>({p,i})).filter(x=>!state.plan[x.i+1]).slice(0,3);$('homeplan').innerHTML=nextDays.map(x=>`<div class="dayplan"><strong>Day ${x.i+1} · ${E(x.p[0])}</strong><div class="small muted">${E(x.p[1])}</div></div>`).join('')||'<p>30 foundation lessons completed!</p>'}
function challenges(){const b=BANK[state.day-1],done=!!state.progress[b.id]?.done;let shown=BANK.filter(x=>(state.filter==='all'||String(x.level)===state.filter)&&(!state.query||(`${x.title} ${x.theme} ${x.prompt}`).toLowerCase().includes(state.query.toLowerCase())));draw('Creative challenge studio','550 ORIGINAL DESIGN BRIEFS',`<div class="filter"><input class="field" id="daySearch" placeholder="Search challenge" value="${E(state.query)}"><select class="field" id="levelFilter"><option value="all">All 5 levels</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${state.filter===String(n)?'selected':''}>Level ${n} · ${['','Beginner','Developing','Intermediate','Advanced','Expert'][n]}</option>`).join('')}</select><input class="field" type="number" min="1" max="550" id="jumpDay" placeholder="Go to day #"><button class="btn secondary" id="jumpBtn">Go</button></div><div class="columns"><div><div class="card" id="promptCard"><div class="spread"><span class="tag">LEVEL ${b.level} / 5 · DAY ${b.id} OF 550</span><span class="pill">⏱ ${b.minutes} min</span></div><h2 style="font-size:clamp(24px,3vw,31px);margin:16px 0 10px">${E(b.title)}</h2><div class="muted small">${E(b.theme)} · ${E(b.focus)}</div><p class="question" style="margin-top:20px">${E(b.prompt)}</p><div style="background:#edf7f0;border-radius:13px;padding:15px;margin-bottom:20px"><div class="tag">YOUR DELIVERABLES</div><p style="margin:8px 0 0">${E(b.deliverables)}</p></div><div class="row"><button class="btn" id="toggleDone">${done?'✓ Completed — undo':'Mark challenge completed'}</button><button class="btn secondary" id="prevDay" ${b.id<=1?'disabled':''}>← Previous</button><button class="btn secondary" id="nextDay" ${b.id>=550?'disabled':''}>Next →</button></div></div><div class="card"><h3>Design journal · Day ${b.id}</h3><p class="muted small">Record two concepts, how the solution works, and a weakness to improve.</p><textarea class="field fieldarea" id="dayNote" placeholder="Idea A / Idea B / How it works / Weakness…">${E(state.notes[b.id]||'')}</textarea><div class="spread" style="margin-top:12px"><button class="btn" id="saveNote">Save note</button><span class="note">Saved in this browser only</span></div><hr style="border:0;border-top:1px solid #ecf1ed;margin:20px 0"><h3>Practice timer</h3><div class="time" id="timerText">${formatTime(state.timerLeft)}</div><div class="row"><button class="btn secondary" id="timerToggle">${state.timerRunning?'Pause':'Start'}</button><button class="btn ghost" id="timerReset">Reset to ${b.minutes} min</button></div></div></div><div class="card"><h3>Challenge library</h3><p class="muted small">Showing ${shown.length} of 550. Every level contains 110 prompts; later levels add constraints and validation tasks.</p><div class="daylist" id="challengeList">${shown.map(x=>`<button class="daybtn ${x.id===state.day?'current':''}" data-day="${x.id}"><span><strong>${x.id}.</strong> ${E(x.title)}</span><span>${state.progress[x.id]?.done?'✓':`L${x.level}`}</span></button>`).join('')}</div></div></div>`);$('daySearch').oninput=e=>{state.query=e.target.value;challenges()};$('levelFilter').onchange=e=>{state.filter=e.target.value;challenges()};$('jumpBtn').onclick=()=>{let n=Number($('jumpDay').value);if(n>=1&&n<=550){state.day=n;state.timerRunning=false;state.timerLeft=BANK[n-1].minutes*60;challenges()}else notify('Enter a day from 1 to 550')};$('toggleDone').onclick=()=>{if(done)delete state.progress[b.id];else state.progress[b.id]={day:b.id,done:true,at:new Date().toISOString()};save(keys.progress,state.progress);challenges();notify(done?'Challenge marked incomplete':'Challenge completed!')};$('prevDay').onclick=()=>moveDay(-1);$('nextDay').onclick=()=>moveDay(1);$('saveNote').onclick=()=>{state.notes[b.id]=$('dayNote').value;save(keys.notes,state.notes);notify('Journal note saved')};$('timerToggle').onclick=toggleTimer;$('timerReset').onclick=()=>resetTimer(b.minutes);$('challengeList').querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{state.day function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function toggleTimer(){state.timerRunning=!state.timerRunning;if(state.timerRunning){if(state.timerLeft<1)state.timerLeft=BANK[state.day-1].minutes*60;clearInterval(state.timerInterval);state.timerInterval=setInterval(()=>{if(state.timerLeft>0)state.timerLeft--;if(state.timerLeft<=0){state.timerRunning=false;clearInterval(state.timerInterval);notify('Time is up! Review your design.')}if($('timerText'))$('timerText').textContent=formatTime(state.timerLeft);if($('timerToggle'))$('timerToggle').textContent=state.timerRunning?'Pause':'Start'},1000)}else clearInterval(state.timerInterval);if($('timerToggle'))$('timerToggle').textContent=state.timerRunning?'Pause':'Start'}

function v5ExamTopic(){return v5.user.goal==='exams'?(v5.user.exams||[]).join(' / '):'General drawing'}
function v5WeakTopics(){const last=v5.scores.slice(0,35);const sums={};last.forEach(s=>{if(!s.topic)return;const p=sums[s.topic]||(sums[s.topic]={sum:0,n:0});p.sum+=Number(s.score)||0;p.n++});return Object.entries(sums).filter(([_,v])=>v.n>=1&&v.sum/v.n<=2.5).sort((a,b)=>a[1].sum/a[1].n-b[1].sum/b[1].n).map(x=>x[0]).slice(0,3)}
function v5Topic(day){const list=V5_TOPICS[v5.user.level]||V5_TOPICS.beginner;const weak=v5WeakTopics();if(day%4===0&&weak.length)return weak[Math.floor(day/4)%weak.length];return list[(day-1)%list.length]}

 document.querySelectorAll('[data-lib]').forEach(x=>x.onclick=()=>{v5.libraryTab=x.dataset.lib;v5Library()});
 $('libCategory').onchange=e=>{v5.libraryFilter=e.target.value;v5Library()};
 let items=tab==='videos'?V5_VIDEOS.map(x=>({...x,category:'video'})):V5_BOOKS.map(x=>({...x,category:'book'}));
 if(tab==='saved')items=[...V5_VIDEOS.map(x=>({...x,category:'video'})),...V5_BOOKS.map(x=>({...x,category:'book'}))].filter(x=>v5.bookmarks[x.url]);
 items=items.filter(x=>level==='all'||x.level===level||x.level==='all');
 $('libResults').innerHTML=items.length?`<div class="v5grid">${items.map(x=>`<div class="card"><span class="tag">${x.category==='video'?'VIDEO':'BOOK / PDF'}</span><h3 style="margin:9px 0 6px">${E(x.title)}</h3><div class="v5small">${E(x.author||x.by||'')} · ${E(x.level||'all')}</div><p class="small muted">${E(x.desc||x.kind||x.format||'')}</p><p class="v5small">${E(x.format||'')}</p><div class="v5actions">${v5External(x.url,x.url.toLowerCase().endsWith('.pdf')?'⬇ Open / download PDF':x.url.startsWith('./')?'⬇ Open / download workbook':'Open resource ↗')}</div><label class="checkrow"><input type="checkbox" data-save="${E(x.url)}" ${v5.bookmarks[x.url]?'checked':''}>Bookmark</label></div>`).join('')}</div>`:'<div class="v5notice">No matching resources yet. Change the level filter.</div>';
 document.querySelectorAll('[data-save]').forEach(x=>x.onchange=()=>{v5.bookmarks[x.dataset.save]=x.checked;v5Save();notify('Bookmark saved')});
}

resourcesPage=v5Library;
function v5Papers(){
 const exam=v5.paperExam||'All',kind=v5.paperKind||'All';
 const papers=V5_PAPERS.filter(p=>(exam==='All'||p.exam===exam)&&(kind==='All'||p.kind.toLowerCase().includes(kind.toLowerCase())));
 draw('Past papers & model practice','REAL EXAM PAPERS · ANSWER KEYS · OFFICIAL SAMPLES',`
 <div class="v5notice"><strong>Real papers, not just links to exams:</strong> UCEED 2022–2026 have separate direct official question-paper and answer-key PDFs below. Earlier UCEED years are in the official archive. NID and NIFT availability is limited to verified official samples or portals — we do not label coaching questions as real PYQs.</div>
 <div class="filter"><select class="field" id="paperExam"><option>All</option>${[...new Set(V5_PAPERS.map(p=>p.exam))].map(x=>`<option ${exam===x?'selected':''}>${E(x)}</option>`).join('')}</select><select class="field" id="paperKind"><option>All</option><option ${kind==='Actual'?'selected':''}>Actual</option><option ${kind==='sample'?'selected':''}>sample</option><option ${kind==='portal'?'selected':''}>portal</option></select></div>
 <div class="v5grid">${papers.map(p=>{const k=p.exam+'-'+p.year;return `<div class="card"><span class="tag">${E(p.exam)} · ${E(p.year)}</span><h3 style="margin-top:9px">${E(p.title)}</h3><p class="small muted">${E(p.kind)} · ${E(p.topic)}</p><div class="v5actions">${v5External(p.url,p.url.endsWith('.pdf')?'⬇ Open / save question PDF':'Open official paper archive')}${p.key?' · '+v5External(p.key,'⬇ Answer key PDF'):''}</div><label class="checkrow"><input type="checkbox" data-paper="${E(k)}" ${v5.pyq[k]?'checked':''}>Mark attempted</label></div>`}).join('')}</div>
 <div class="v5panel"><h3>Original model questions and mini-mocks</h3><p class="muted small">Practice models are our own, not actual past papers. Timed aptitude and creative challenges are available separately.</p><button class="btn" id="paperMock">Take a model mock →</button> <button class="btn secondary" id="paperChallenge">Try a design brief →</button></div>`);
 $('paperExam').onchange=e=>{v5.paperExam=e.target.value;v5Papers()};$('paperKind').onchange=e=>{v5.paperKind=e.target.value;v5Papers()};
 document.querySelectorAll('[data-paper]').forEach(x=>x.onchange=()=>{v5.pyq[x.dataset.paper]=x.checked;v5Save();notify('Attempt recorded')});
 $('paperMock').onclick=()=>navigate('mocks');$('paperChallenge').onclick=()=>navigate('challenges');
}

papersPage=v5Papers;
function v5PortfolioDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('DesignSprintArtwork',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('art'))db.createObjectStore('art',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function v5ArtAll(){const db=await v5PortfolioDB();return await new Promise((resolve,reject)=>{const tx=db.transaction('art');const q=tx.objectStore('art').getAll();q.onsuccess=()=>resolve(q.result.sort((a,b)=>b.date.localeCompare(a.date)));q.onerror=()=>reject(q.error)})}
async function v5ArtPut(item){const db=await v5PortfolioDB();return new Promise((resolve,reject)=>{const req=db.transaction('art','readwrite').objectStore('art').put(item);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)})}
async function v5ArtDelete(id){const db=await v5PortfolioDB();return new Promise((resolve,reject)=>{const req=db.transaction('art','readwrite').objectStore('art').delete(id);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)})}
async function v5ImgShrink(file){return await new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('Choose a photo'));const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1250/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*k);canvas.height=Math.round(img.height*k);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.73))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Could not read photo'))};img.src=url})}
function v5Portfolio(){draw('My sketchbook & portfolio','SAVE ARTWORK · COMPARE GROWTH',`<div class="v5notice">Your drawings stay in this browser's local database and are not uploaded to a server. Export important images regularly; browser clearing may erase them.</div><div class="v5panel"><h3>Add a drawing to your portfolio</h3><label class="v5field">Title <input id="artTitle" class="field" placeholder="Example: First perspective sketch" maxlength="85"></label><label class="v5field">Skill topic<select class="field" id="artTopic">${[...new Set(Object.values(V5_TOPICS).flat())].map(t=>`<option>${E(t)}</option>`).join('')}</select></label><label class="v5field">Choose drawing photo<input id="artFile" class="field" type="file" accept="image/*"></label><label class="v5field">Notes<textarea id="artNotes" class="field fieldarea" maxlength="450" placeholder="What worked? What would you improve?"></textarea></label><button class="btn" id="artSave">Save drawing</button></div><div class="v5panel"><h3>Your saved artwork</h3><div id="artGallery"><p class="muted small">Loading your sketchbook…</p></div></div><div class="v5panel"><h3>Drawing feedback</h3><p class="small muted">For a real AI review, attach your sketch in ChatGPT and request feedback on proportions, observation, perspective and clarity. DesignSprint itself does not automatically grade your image.</p>${v5External('https://chatgpt.com/','Open ChatGPT for feedback')} <button class="btn secondary" id="artAssess">Record a self-assessment</button></div>`);
$('artSave').onclick=async()=>{const f=$('artFile').files?.[0];if(!f)return notify('Select a drawing photo');if(f.size>12e6)return notify('Please choose a photo under 12 MB');try{const img=await v5ImgShrink(f);await v5ArtPut({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),date:new Date().toISOString(),title:$('artTitle').value.trim()||'Untitled sketch',topic:$('artTopic').value,notes:$('artNotes').value.trim(),img});v3Record('Portfolio','Saved drawing: '+($('artTitle').value.trim()||'Untitled'));notify('Drawing saved on this device');v5Portfolio()}catch(e){notify('Save failed: '+e.message)}};$('artAssess').onclick=()=>navigate('assessment');v5LoadArtGallery()}
async function v5LoadArtGallery(){const root=$('artGallery');if(!root)return;try{const art=await v5ArtAll();if(!$('artGallery'))return;root.innerHTML=art.length?`<div class="v5grid">${art.slice(0,80).map(x=>`<div class="card"><img src="${x.img}" class="v5portrait" alt="Saved drawing"><h3 style="margin:10px 0 4px">${E(x.title)}</h3><div class="v5small">${E(x.date.slice(0,10))} · ${E(x.topic)}</div><p class="small muted">${E(x.notes)}</p><div class="v5actions"><button class="btn secondary" data-artdl="${E(x.id)}">Save image</button><button class="btn secondary" data-artdelete="${E(x.id)}">Delete</button></div></div>`).join('')}</div>`:'<p class="muted">No drawings yet. Add your first sketch above.</p>';root.querySelectorAll('[data-artdl]').forEach(b=>b.onclick=()=>{const x=art.find(v=>v.id===b.dataset.artdl);const a=document.createElement('a');a.href=x.img;a.download='DesignSprint-'+x.date.slice(0,10)+'.jpg';a.click()});root.querySelectorAll('[data-artdelete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this drawing from this browser?')){await v5ArtDelete(b.dataset.artdelete);v5LoadArtGallery()}})}catch(e){root.textContent='Artwork storage unavailable in this browser: '+e.message}}
function v5Assessment(){const topic=v5.assessTopic||v5Topic(v5NextDay());draw('Drawing feedback & assessment','HONEST SELF-EVALUATION',`<div class="v5notice">This rubric is a self-assessment, not automatic AI grading. To obtain image feedback, attach your drawing in ChatGPT. Scores here help your personal revision plan.</div><div class="v5panel"><h3>Assess your latest sketch</h3><label class="v5field">Topic <select id="assessTopic" class="field">${[...new Set(Object.values(V5_TOPICS).flat())].map(t=>`<option ${t===topic?'selected':''}>${E(t)}</option>`).join('')}</select></label><p class="small muted">Rate each from 1 (needs work) to 5 (strong). Be realistic and compare against the exercise objective.</p>${[['accuracy','Observation / accuracy'],['proportion','Proportion / perspective'],['clarity','Sketch clarity'],['ideas','Creativity / problem-solving']].map(([k,n])=>`<label class="v5field"><strong>${n}</strong><select class="field" id="score-${k}">${[1,2,3,4,5].map(i=>`<option value="${i}" ${i===3?'selected':''}>${i} / 5</option>`).join('')}</select></label>`).join('')}<label class="v5field">One improvement to make<textarea id="assessNote" class="field fieldarea" maxlength="260" placeholder="For example: Perspective edges do not align"></textarea></label><button class="btn" id="saveAssess">Save assessment</button></div><div class="v5panel"><h3>How to get individual feedback</h3><p class="small">Upload a drawing in ChatGPT and ask: “Evaluate my sketch for drawing level, proportions, perspective, clarity, and give me a 15-minute corrective exercise.”</p>${v5External('https://chatgpt.com/','Submit drawing for external feedback')}</div>`);$('assessTopic').onchange=e=>v5.assessTopic=e.target.value;$('saveAssess').onclick=()=>{const vals=['accuracy','proportion','clarity','ideas'].map(k=>Number($('score-'+k).value));v5.scores.unshift({date:new Date().toISOString(),topic:$('assessTopic').value,score:vals.reduce((a,b)=>a+b,0)/4,scores:vals,note:$('assessNote').value.trim()});v5Save();v3Record('Assessment',`Sketch: ${$('assessTopic').value} (${(vals.reduce((a,b)=>a+b,0)/4).toFixed(1)}/5)`);notify('Assessment saved; plan may revisit weak topics');navigate('dashboard')}}
function v5Streak(){let dates=new Set([...v3.sessions.map(s=>(s.at||'').slice(0,10)),...v5.scores.map(x=>x.date.slice(0,10)),...Object.values(state.progress).filter(x=>x.done).map(x=>(x.at||'').slice(0,10))].filter(Boolean));let streak=0;const d=new Date();if(!dates.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(dates.has(d.toISOString().slice(0,10))){streak++;d.setDate(d.getDate()-1)}return streak}
function v5Dashboard(){const sessions=v3.sessions.reduce((a,b)=>a+Number(b.minutes||0),0),attempts=v2.mocks.length,weak=v5WeakTopics(),ass=v5.scores.slice(0,10);draw('Progress dashboard','STREAKS · SKILLS · HISTORY',`<div class="v5grid"><div class="card"><span class="tag">PRACTICE TIME</span><div class="stat">${(sessions/60).toFixed(1)}h</div><div class="v5small">Recorded across ${v3.sessions.length} sessions</div></div><div class="card"><span class="tag">STUDY STREAK</span><div class="stat">${v5Streak()} days</div><div class="v5small">Flexible rest days are okay</div></div><div class="card"><span class="tag">CREATIVE BRIEFS</span><div class="stat">${accomplished()} / 550</div><div class="v5track"><div style="width:${accomplished()/550*100}%"></div></div></div><div class="card"><span class="tag">MOCKS</span><div class="stat">${attempts}</div><div class="v5small">${attempts?'Most recent: '+Math.round(v2.mocks[0].correct/v2.mocks[0].total*100)+'%':'Take your first mini-mock'}</div></div></div><div class="v5panel"><h3>Skill development</h3><p class="note">Based on self-assessments; not objective AI grading.</p>${[...new Set(v5.scores.map(x=>x.topic))].slice(0,12).map(t=>{const a=v5.scores.filter(x=>x.topic===t);const avg=a.reduce((s,x)=>s+x.score,0)/a.length;return `<div style="margin:10px 0"><div class="spread small"><strong>${E(t)}</strong><span>${avg.toFixed(1)}/5 · ${a.length} review(s)</span></div><div class="v5track"><div style="width:${avg*20}%"></div></div></div>`}).join('')||'<p class="muted">Start with an assessment to see your skill results.</p>'}</div><div class="v5panel"><h3>Recommended revision</h3>${weak.length?weak.map(t=>`<div class="v5timeline"><strong>${E(t)}</strong><p class="small muted">Review a short video, redraw one study, then score again.</p></div>`).join(''):'<p class="muted small">No weak skills recorded yet. Your revision suggestions will appear after assessments.</p>'}<div class="v5actions"><button class="btn" id="dashAssess">Assess a drawing</button><button class="btn secondary" id="dashHistory">View full history</button></div></div><div class="v5panel"><h3>Recent assessment trend</h3>${ass.length?`<div class="v5chart">${ass.slice().reverse().map(a=>`<div title="${E(a.topic)} ${a.score.toFixed(1)}/5" style="height:${a.score*20}%"></div>`).join('')}</div><p class="note">Most recent results to the right.</p>`:'<p class="muted">Complete assessments to see a trend.</p>'}</div><div class="v5panel"><h3>Save your progress</h3><p class="small muted">Export the JSON history regularly. Drawing images are stored separately in your local sketchbook and should be saved individually.</p><button class="btn secondary" id="dashBackup">Download history backup</button></div>`);$('dashAssess').onclick=()=>navigate('assessment');$('dashHistory').onclick=()=>navigate('history');$('dashBackup').onclick=exportData}
const v5OldMok=mocksPage;
mocksPage=function(){v5OldMok();$('content').insertAdjacentHTML('afterbegin',`<div class="v5notice">These mini-mocks use original questions. They are **not** official full-length papers or official rank predictions. For exam-specific past papers, open the PYQ library.</div><div class="v5panel"><h3>Mock performance</h3>${v2.mocks.length?v2.mocks.slice(0,8).map((m,i)=>`<div class="spread" style="padding:7px 0"><span>Attempt ${v2.mocks.length-i} · ${E((m.date||'').slice(0,10))}</span><strong>${Math.round(m.correct/m.total*100)}%</strong></div>`).join(''):'<p class="muted">Take your first mock to see scores.</p>'}</div>`)};
const v5OldLessons=lessonsPage;
lessonsPage=function(){v5OldLessons();$('content').insertAdjacentHTML('afterbegin',`<div class="v5notice">Today's personalized focus: <strong>${E(v5Topic(v5NextDay()))}</strong>. You can follow the general 30-day course below, or use your custom plan on the Study Plan page.</div>`)};
const v5OldJournal=journal;
journal=function(){v5OldJournal();$('content').insertAdjacentHTML('afterbegin',`<div class="v5panel"><h3>Personal learning settings</h3><p>Level: <strong>${E(v5Levels[v5.user.level])}</strong> · Goal: <strong>${E(v5ExamTopic())}</strong> · Daily: <strong>${v5.user.minutes} minutes</strong></p><button class="btn secondary" id="v5SettingsEdit">Edit learning profile</button></div>`);$('v5SettingsEdit').onclick=()=>v5Onboarding(true);const reset=$('resetData');if(reset){reset.onclick=()=>{if(confirm('Erase all saved DesignSprint study data on this browser? Back up first. Artwork must be deleted separately from Sketchbook.')){[...Object.values(keys),...Object.values(V2KEYS),...Object.values(V3_KEYS),V4_KEY,V5_STORE,V5_RESULTS,V5_PYQ,V5_BOOKMARKS,V5_PRACTICE].forEach(k=>localStorage.removeItem(k));location.reload()}}}};
const v5OldExport=exportData;
exportData=function(){const data={app:'DesignSprint',version:1,exported:new Date().toISOString(),progress:state.progress,notes:state.notes,plan:state.plan,quiz:state.quiz,settings:state.settings,drawing:v2.drawing,mocks:v2.mocks,lessons:v2.lessons,activity:v3.activity,sessions:v3.sessions,profile,v5:{user:v5.user,scores:v5.scores,pyq:v5.pyq,bookmarks:v5.bookmarks,practice:v5.practice},note:'Images are saved separately in this browser IndexedDB and not included in JSON backup.'};const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='DesignSprint-v5-history-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),7000)};
importData=async function(e){const f=e.target.files?.[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='DesignSprint'||o.version!==1||!o.progress||!o.notes||!Array.isArray(o.quiz))throw Error('Invalid DesignSprint backup');if(!confirm('Replace current study history with backup? Artwork stays unchanged.'))return;state.progress=o.progress;state.notes=o.notes;state.plan=o.plan||{};state.quiz=o.quiz;state.settings=o.settings||{dailyMins:30};for(const [k,val] of Object.entries({progress:state.progress,notes:state.notes,plan:state.plan,quiz:state.quiz,setting:state.settings}))save(keys[k],val);v2.drawing=o.drawing||{};v2.mocks=o.mocks||[];v2.lessons=o.lessons||{};storeV2();v3.activity=o.activity||[];v3.sessions=o.sessions||[];save(V3_KEYS.activity,v3.activity);save(V3_KEYS.sessions,v3.sessions);profile=o.profile||profile;save(V4_KEY,profile);if(o.v5){Object.assign(v5,o.v5);v5Save()}notify('History restored');navigate('dashboard')}catch(err){notify('Could not import: '+err.message)}};
const v5OriginalRender=render;
render=function(){if(state.page==='portfolio')v5Portfolio();else if(state.page==='assessment')v5Assessment();else if(state.page==='dashboard')v5Dashboard();else v5OriginalRender()};
// Rebuild menu with clear sections, retaining the existing challenge, quiz and mock engines.
views.splice(0,views.length,...[['home','⌂','Home'],['planner','▤','My plan'],['drawing','✍','Drawing studio'],['portfolio','▧','Sketchbook'],['assessment','◉','Feedback'],['challenges','✦','550 challenges'],['lessons','▶','Lessons'],['quiz','◇','Aptitude'],['papers','◫','Past papers'],['mocks','◷','Mocks'],['resources','♧','Free books & PDFs'],['dashboard','▥','Progress'],['history','↺','History'],['journal','⚙','Settings']]);
const v5FinalRender=render;
render=function(){if(state.page==='history')historyPage();else v5FinalRender()};
// Existing v4 home had a profile card that can conflict with this new flow; v5 keeps just its updated guided onboarding.
document.querySelector('.sidefoot').innerHTML='550 creative questions · free study tools<br>Progress stays on this device. Download backups.';
render();
if(!v5.user.onboarded)setTimeout(()=>v5Onboarding(),120);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}

</script></body></html>
